name: Friday CI

on:
  push:
    branches: [main, build/friday-core-mvp]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit locked dependencies
        run: npm audit --audit-level=moderate

      - name: Verify repository
        run: make verify

      - name: Install isolated browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Test trusted project tasks in synthetic local browser fixture
        run: npm run test:e2e

      - name: Verify signed Access identity can load built UI
        run: node --test server/security/access-staging.test.mjs

      - name: Validate shell scripts
        run: |
          for file in scripts/*.sh; do
            echo "checking $file"
            sh -n "$file"
          done

      - name: Verify isolated Friday staging Compose without starting services
        run: sh scripts/verify-friday-staging.sh

      - name: Verify observer security boundary
        run: |
          grep -qx '.env' observer/.dockerignore
          if grep -RniE '/containers/.*/(start|stop|restart|kill|exec)|/images/create|/volumes|/networks/.*/(connect|disconnect)' observer/config.mjs observer/docker.mjs observer/server.mjs; then
            echo 'Observer mutation API path detected.' >&2
            exit 1
          fi
          if grep -Rni 'FRIDAY_VM100_OBSERVER_TOKEN' src; then
            echo 'Observer token reference detected in frontend source.' >&2
            exit 1
          fi
          if grep -RniE 'VITE_.*OBSERVER' src server observer compose.yaml .env.example; then
            echo 'Browser-visible observer secret variable detected.' >&2
            exit 1
          fi

      - name: Verify monitoring safety boundary
        run: |
          if grep -RniE "request\.method === '(POST|PUT|PATCH|DELETE)' && url\.pathname === '/api/(incidents|monitoring)" server; then
            echo 'Monitoring mutation route detected.' >&2
            exit 1
          fi
          if grep -RniE '/containers/.*/(start|stop|restart|kill|exec)|/images/create|/volumes|/networks/.*/(connect|disconnect)' server/monitoring server/http.mjs; then
            echo 'Monitoring Docker mutation API path detected.' >&2
            exit 1
          fi
          if grep -RniE 'VITE_.*(MONITOR|INCIDENT|OBSERVER)' src server observer compose.yaml .env.example; then
            echo 'Browser-visible monitoring/observer secret variable detected.' >&2
            exit 1
          fi

      - name: Verify diagnostics safety boundary
        run: |
          if grep -RniE '/containers/.*/(start|stop|restart|kill|exec)|/images/create|/volumes|/networks/.*/(connect|disconnect)|/archive' observer/config.mjs observer/docker.mjs observer/server.mjs server/diagnostics server/adapters/vm100-observer-diagnostics.mjs server/monitoring/runtime.mjs; then
            echo 'Diagnostics mutation API path detected.' >&2
            exit 1
          fi

          controller_diagnostic_writes="$(grep -niE "request\.method === '(POST|PUT|PATCH|DELETE)'.*(diagnostic|/api/incidents/.*/logs)" server/http.mjs || true)"
          unexpected_controller_writes="$(printf '%s\n' "$controller_diagnostic_writes" | grep -vF "request.method === 'POST' && diagnosticRerunRoute" || true)"
          if [ -n "$unexpected_controller_writes" ]; then
            printf '%s\n' "$unexpected_controller_writes" >&2
            echo 'Unexpected diagnostics write route detected.' >&2
            exit 1
          fi
          if ! printf '%s\n' "$controller_diagnostic_writes" | grep -qF "request.method === 'POST' && diagnosticRerunRoute"; then
            echo 'Expected read-only diagnostic rerun route boundary is missing.' >&2
            exit 1
          fi
          if grep -niE "request\.method === '(POST|PUT|PATCH|DELETE)'.*(diagnostic|/api/incidents/.*/logs)" observer/server.mjs; then
            echo 'Observer diagnostics write route detected.' >&2
            exit 1
          fi

          if grep -RniE 'child_process|execFile\(|spawn\(|ssh ' server/diagnostics server/adapters/vm100-observer-diagnostics.mjs server/monitoring/runtime.mjs observer/config.mjs observer/docker.mjs observer/server.mjs; then
            echo 'Shell or SSH diagnostics path detected.' >&2
            exit 1
          fi
          if grep -RniE 'VITE_.*(TOKEN|SECRET|OBSERVER|DIAGNOSTIC)' src server observer compose.yaml .env.example; then
            echo 'Browser-visible diagnostics secret variable detected.' >&2
            exit 1
          fi
          if grep -RniE 'Config\.Env|\.Env\b' observer/docker.mjs observer/server.mjs; then
            echo 'Raw Docker environment forwarding detected in diagnostics source.' >&2
            exit 1
          fi

      - name: Verify shared-work security boundary
        run: |
          if grep -RniE 'child_process|execFile\(|spawn\(|ssh ' server/work --exclude='*.test.mjs'; then
            echo 'Shared-work execution interface detected' >&2
            exit 1
          fi
          if grep -niE "url\.pathname.*(/api/(work|memory|decisions|handoffs))" server/http.mjs; then
            echo 'Unreviewed shared-work public endpoint detected' >&2
            exit 1
          fi
          if grep -RniE 'VITE_.*(SUPABASE|SERVICE_KEY|SECRET|MEMORY_TOKEN)' src .env.example compose.yaml; then
            echo 'Browser-exposed work credential detected' >&2
            exit 1
          fi

      - name: Verify read-only Supabase gateway preflight contract
        run: node --test scripts/preflight-shared-work-target.test.mjs

      - name: Validate Git fabric catalog and internal-only Phase 2C security
        run: |
          npm run validate:fabric-catalog
          node --test server/fabric/*.test.mjs scripts/validate-fabric-catalog.test.mjs
          if grep -RniE 'child_process|execFile\(|spawn\(|/containers/.*/(start|stop|restart|kill|exec)' server/fabric --exclude='*.test.mjs'; then
            echo 'Phase 2C fabric added forbidden execution capability' >&2
            exit 1
          fi
          if grep -niE "url\.pathname.*(/api/(policy|plugins|context|fabric|work|memory)|/mcp)" server/http.mjs; then
            echo 'Unreviewed fabric public endpoint exposed' >&2
            exit 1
          fi
          if grep -RniE 'VITE_.*(SUPABASE|SERVICE_KEY|SECRET|TOKEN)' src .env.example compose.yaml; then
            echo 'Browser-exposed credential variable detected' >&2
            exit 1
          fi

      - name: Verify dormant Phase 2C release boundary
        run: npm run verify:fabric-dormant

      - name: Verify controller Access JWT and Docker socket boundary
        run: node --test server/security/*.test.mjs server/http.security.test.mjs scripts/verify-controller-security.test.mjs

      - name: Validate shared-work schema
        run: npm run validate:shared-work-schema

      - name: Test shared-work Postgres transactions
        run: npm run test:shared-work-db

      - name: Verify model-fabric read-only and credential boundary
        run: |
          if grep -RniE 'NVIDIA_API_KEY|VITE_.*NVIDIA|VITE_.*(API_KEY|TOKEN|SECRET|SERVICE_KEY)' src; then
            echo 'Model credential or frontend secret detected.' >&2
            exit 1
          fi
          if grep -RniE 'VITE_.*(NVIDIA|API_KEY|TOKEN|SECRET|SERVICE_KEY)' .env.example compose.yaml server/ai server/config.mjs; then
            echo 'Browser-visible model secret detected.' >&2
            exit 1
          fi
          if grep -niE 'child_process|execFile\(|spawn\(|ssh ' server/ai/model-*.mjs server/ai/nvidia.mjs; then
            echo 'Model-fabric infrastructure execution path detected.' >&2
            exit 1
          fi
          if grep -niE "request\.method === '(POST|PUT|PATCH|DELETE)'.*(model-fabric|infrastructure)" server/http.mjs; then
            echo 'Model fabric or infrastructure mutation route detected.' >&2
            exit 1
          fi

      - name: Validate agent registry schema
        run: npm run validate:agent-registry-schema

      - name: Verify local agent safety boundary
        run: |
          if grep -RniE --exclude-dir=superpowers 'VITE_.*SUPA[B]ASE|VITE_.*SERVICE_[K]EY' .env.example compose.yaml src server docs; then
            echo 'Browser-visible Supabase credential detected.' >&2
            exit 1
          fi
          if grep -RniE --exclude='*.test.mjs' --exclude='*.test.ts' --exclude='*.test.tsx' 'api/agents.*(execute|restart|shell)' server src; then
            echo 'Agent execution route detected.' >&2
            exit 1
          fi
          if grep -RniE 'child_process|execFile\(|spawn\(|ssh ' server/agents; then
            echo 'Agent shell or SSH execution path detected.' >&2
            exit 1
          fi

      - name: Validate controller Compose
        run: docker compose config >/dev/null

      - name: Validate local Docker live override
        run: docker compose -f compose.yaml -f compose.live.yaml config >/dev/null

      - name: Validate VM100 observer Compose
        run: FRIDAY_OBSERVER_TOKEN=ci-test FRIDAY_OBSERVER_BIND_ADDRESS=127.0.0.1 FRIDAY_DOCKER_SOCKET_GID="$(stat -c %g /var/run/docker.sock)" docker compose -f observer/compose.yaml config >/dev/null

      - name: Build controller container
        run: docker build -t friday-ci .

      - name: Smoke test private Friday staging image without tunnel or host ports
        run: sh scripts/test-friday-staging-isolation.sh

      - name: Scan controller image for OS and Node vulnerabilities
        run: sh scripts/scan-controller-image.sh friday-ci

      - name: Smoke test isolated non-root controller
        run: sh scripts/test-controller-container-hardening.sh friday-ci

      - name: Verify real live-mode image fails closed without Access configuration
        run: sh scripts/test-access-live-failclosed.sh friday-ci

      - name: Rehearse read-only root-to-nonroot data volume migration
        run: sh scripts/test-friday-volume-migration.sh friday-ci

      - name: Build VM100 observer container
        run: docker build -t friday-observer-ci observer

      - name: Build restricted Docker socket proxy
        run: docker build -f observer/Dockerfile.proxy -t friday-observer-proxy-ci observer

      - name: Scan observer and proxy runtime images
        run: |
          sh scripts/scan-controller-image.sh friday-observer-ci
          sh scripts/scan-controller-image.sh friday-observer-proxy-ci

      - name: Verify isolated Docker API read-only boundary
        run: sh scripts/test-observer-proxy-isolation.sh friday-observer-proxy-ci friday-observer-ci
