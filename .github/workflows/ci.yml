name: Friday CI

on:
  push:
    branches: [main, build/friday-core-mvp]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate shell scripts
        run: |
          for file in scripts/*.sh; do
            echo "checking $file"
            sh -n "$file"
          done

      - name: Validate controller Compose
        run: docker compose config >/dev/null

      - name: Validate local Docker live override
        run: docker compose -f compose.yaml -f compose.live.yaml config >/dev/null

      - name: Validate VM100 observer Compose
        run: FRIDAY_OBSERVER_TOKEN=ci-test FRIDAY_OBSERVER_BIND_ADDRESS=127.0.0.1 docker compose -f observer/compose.yaml config >/dev/null

      - name: Build controller container
        run: docker build -t friday-ci .

      - name: Build VM100 observer container
        run: docker build -t friday-observer-ci observer
