services:
  friday:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: friday
    restart: unless-stopped
    ports:
      - "${FRIDAY_UI_PORT:-3010}:3010"
    environment:
      TZ: ${TZ:-America/Chicago}
      FRIDAY_PORT: 3010
      FRIDAY_MODE: ${FRIDAY_MODE:-mock}
      FRIDAY_ACCESS_TEAM_DOMAIN: ${FRIDAY_ACCESS_TEAM_DOMAIN:-}
      FRIDAY_ACCESS_AUD: ${FRIDAY_ACCESS_AUD:-}
      FRIDAY_ACCESS_OPERATOR_EMAILS: ${FRIDAY_ACCESS_OPERATOR_EMAILS:-}
      FRIDAY_AUTOMATION_ENABLED: ${FRIDAY_AUTOMATION_ENABLED:-false}
      FRIDAY_AUTOMATION_PORT: 3011
      FRIDAY_AUTOMATION_ACCESS_TEAM_DOMAIN: ${FRIDAY_AUTOMATION_ACCESS_TEAM_DOMAIN:-}
      FRIDAY_AUTOMATION_ACCESS_AUD: ${FRIDAY_AUTOMATION_ACCESS_AUD:-}
      FRIDAY_AUTOMATION_SERVICE_TOKEN_IDS: ${FRIDAY_AUTOMATION_SERVICE_TOKEN_IDS:-}
      FRIDAY_REPOSITORY_REGISTRY_PATH: ${FRIDAY_REPOSITORY_REGISTRY_PATH:-./repositories.json}
      FRIDAY_DOCKER_ENABLED: ${FRIDAY_DOCKER_ENABLED:-false}
      FRIDAY_DOCKER_SOCKET: /var/run/docker.sock
      FRIDAY_DOCKER_HOST_NAME: ${FRIDAY_DOCKER_HOST_NAME:-VM 102}
      FRIDAY_DOCKER_SITE: ${FRIDAY_DOCKER_SITE:-}
      FRIDAY_PROXMOX_ENABLED: ${FRIDAY_PROXMOX_ENABLED:-false}
      FRIDAY_PROXMOX_URL: ${FRIDAY_PROXMOX_URL:-}
      FRIDAY_PROXMOX_TOKEN_ID: ${FRIDAY_PROXMOX_TOKEN_ID:-}
      FRIDAY_PROXMOX_TOKEN_SECRET: ${FRIDAY_PROXMOX_TOKEN_SECRET:-}
      FRIDAY_PROXMOX_INSECURE: ${FRIDAY_PROXMOX_INSECURE:-false}
      FRIDAY_PROXMOX_SITE: ${FRIDAY_PROXMOX_SITE:-}
      FRIDAY_VM100_OBSERVER_ENABLED: ${FRIDAY_VM100_OBSERVER_ENABLED:-false}
      FRIDAY_VM100_OBSERVER_URL: ${FRIDAY_VM100_OBSERVER_URL:-}
      FRIDAY_VM100_OBSERVER_TOKEN: ${FRIDAY_VM100_OBSERVER_TOKEN:-}
      FRIDAY_VM100_OBSERVER_HOST_NAME: ${FRIDAY_VM100_OBSERVER_HOST_NAME:-VM 100}
      FRIDAY_VM100_OBSERVER_SITE: ${FRIDAY_VM100_OBSERVER_SITE:-}
      FRIDAY_MONITORING_ENABLED: ${FRIDAY_MONITORING_ENABLED:-false}
      FRIDAY_MONITORING_POLL_SECONDS: ${FRIDAY_MONITORING_POLL_SECONDS:-30}
      FRIDAY_MONITORING_OFFLINE_GRACE_SECONDS: ${FRIDAY_MONITORING_OFFLINE_GRACE_SECONDS:-300}
      FRIDAY_MONITORING_STATE_PATH: ${FRIDAY_MONITORING_STATE_PATH:-/data/monitoring-state.json}
      FRIDAY_MONITORING_HISTORY_LIMIT: ${FRIDAY_MONITORING_HISTORY_LIMIT:-2000}
      FRIDAY_DIAGNOSTICS_ENABLED: ${FRIDAY_DIAGNOSTICS_ENABLED:-false}
      FRIDAY_AUDIT_ENABLED: ${FRIDAY_AUDIT_ENABLED:-false}
      FRIDAY_AUDIT_DIR: ${FRIDAY_AUDIT_DIR:-/data/audit}
      FRIDAY_SITE_SETTINGS_PATH: ${FRIDAY_SITE_SETTINGS_PATH:-/data/site-settings.json}
      FRIDAY_ENDPOINTS_ENABLED: ${FRIDAY_ENDPOINTS_ENABLED:-false}
      FRIDAY_ENDPOINT_CHECKS_JSON: ${FRIDAY_ENDPOINT_CHECKS_JSON:-}
      FRIDAY_ENDPOINT_URLS: ${FRIDAY_ENDPOINT_URLS:-}
      FRIDAY_ENDPOINTS_SITE: ${FRIDAY_ENDPOINTS_SITE:-}
      FRIDAY_OMADA_ENABLED: ${FRIDAY_OMADA_ENABLED:-false}
      FRIDAY_OMADA_URL: ${FRIDAY_OMADA_URL:-}
      FRIDAY_OMADA_CONTROLLER_ID: ${FRIDAY_OMADA_CONTROLLER_ID:-}
      FRIDAY_OMADA_CLIENT_ID: ${FRIDAY_OMADA_CLIENT_ID:-}
      FRIDAY_OMADA_CLIENT_SECRET: ${FRIDAY_OMADA_CLIENT_SECRET:-}
      FRIDAY_ADGUARD_ENABLED: ${FRIDAY_ADGUARD_ENABLED:-false}
      FRIDAY_ADGUARD_URL: ${FRIDAY_ADGUARD_URL:-}
      FRIDAY_ADGUARD_USERNAME: ${FRIDAY_ADGUARD_USERNAME:-}
      FRIDAY_ADGUARD_PASSWORD: ${FRIDAY_ADGUARD_PASSWORD:-}
      FRIDAY_ADGUARD_SITE: ${FRIDAY_ADGUARD_SITE:-}
      FRIDAY_PROMETHEUS_ENABLED: ${FRIDAY_PROMETHEUS_ENABLED:-false}
      FRIDAY_PROMETHEUS_URL: ${FRIDAY_PROMETHEUS_URL:-}
      FRIDAY_PROMETHEUS_USERNAME: ${FRIDAY_PROMETHEUS_USERNAME:-}
      FRIDAY_PROMETHEUS_PASSWORD: ${FRIDAY_PROMETHEUS_PASSWORD:-}
      FRIDAY_PROMETHEUS_SITE: ${FRIDAY_PROMETHEUS_SITE:-}
      FRIDAY_UPTIME_KUMA_ENABLED: ${FRIDAY_UPTIME_KUMA_ENABLED:-false}
      FRIDAY_UPTIME_KUMA_URL: ${FRIDAY_UPTIME_KUMA_URL:-}
      FRIDAY_UPTIME_KUMA_API_KEY: ${FRIDAY_UPTIME_KUMA_API_KEY:-}
      FRIDAY_UPTIME_KUMA_SITE: ${FRIDAY_UPTIME_KUMA_SITE:-}
      FRIDAY_GRAFANA_ENABLED: ${FRIDAY_GRAFANA_ENABLED:-false}
      FRIDAY_GRAFANA_URL: ${FRIDAY_GRAFANA_URL:-}
      FRIDAY_GRAFANA_TOKEN: ${FRIDAY_GRAFANA_TOKEN:-}
      FRIDAY_GRAFANA_SITE: ${FRIDAY_GRAFANA_SITE:-}
      FRIDAY_AGENT_REGISTRY_ENABLED: ${FRIDAY_AGENT_REGISTRY_ENABLED:-false}
      FRIDAY_SUPABASE_URL: ${FRIDAY_SUPABASE_URL:-}
      FRIDAY_SUPABASE_SERVICE_KEY: ${FRIDAY_SUPABASE_SERVICE_KEY:-}
      FRIDAY_SUPABASE_HEALTH_ENABLED: ${FRIDAY_SUPABASE_HEALTH_ENABLED:-}
      FRIDAY_SUPABASE_SITE: ${FRIDAY_SUPABASE_SITE:-}
      # Verified CT108 nic1 endpoint on vmbr1 / VLAN 10.
      FRIDAY_AGENT_LOCAL_ROUTER_URL: ${FRIDAY_AGENT_LOCAL_ROUTER_URL:-http://10.1.10.12:11434}
      FRIDAY_AGENT_LOCAL_ROUTER_MODEL: ${FRIDAY_AGENT_LOCAL_ROUTER_MODEL:-qwen3:4b-instruct}
      FRIDAY_AGENT_LOCAL_ROUTER_TIMEOUT_MS: ${FRIDAY_AGENT_LOCAL_ROUTER_TIMEOUT_MS:-15000}
      FRIDAY_AGENT_LOCAL_GENERAL_URL: ${FRIDAY_AGENT_LOCAL_GENERAL_URL:-http://10.1.10.12:11434}
      FRIDAY_AGENT_LOCAL_GENERAL_MODEL: ${FRIDAY_AGENT_LOCAL_GENERAL_MODEL:-qwen3:4b-instruct}
      FRIDAY_AGENT_LOCAL_GENERAL_TIMEOUT_MS: ${FRIDAY_AGENT_LOCAL_GENERAL_TIMEOUT_MS:-90000}
      FRIDAY_AGENT_LOCAL_CODER_URL: ${FRIDAY_AGENT_LOCAL_CODER_URL:-http://10.1.10.12:11434}
      FRIDAY_AGENT_LOCAL_CODER_MODEL: ${FRIDAY_AGENT_LOCAL_CODER_MODEL:-qwen3:4b-instruct}
      FRIDAY_AGENT_LOCAL_CODER_TIMEOUT_MS: ${FRIDAY_AGENT_LOCAL_CODER_TIMEOUT_MS:-90000}
      FRIDAY_AGENT_MODEL_CONTEXT: ${FRIDAY_AGENT_MODEL_CONTEXT:-8192}
      FRIDAY_AGENT_MODEL_MAX_TOKENS: ${FRIDAY_AGENT_MODEL_MAX_TOKENS:-768}
      FRIDAY_AI_ENABLED: ${FRIDAY_AI_ENABLED:-false}
      FRIDAY_AI_PROVIDER_ORDER: ${FRIDAY_AI_PROVIDER_ORDER:-groq,gemini,ollama}
      FRIDAY_AI_REQUEST_TIMEOUT_MS: ${FRIDAY_AI_REQUEST_TIMEOUT_MS:-}
      FRIDAY_CLOUD_AI_TIMEOUT_MS: ${FRIDAY_CLOUD_AI_TIMEOUT_MS:-}
      FRIDAY_LOCAL_AI_TIMEOUT_MS: ${FRIDAY_LOCAL_AI_TIMEOUT_MS:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      FRIDAY_LOCAL_AI_ENABLED: ${FRIDAY_LOCAL_AI_ENABLED:-false}
      FRIDAY_LOCAL_AI_URL: ${FRIDAY_LOCAL_AI_URL:-http://ollama:11434}
      FRIDAY_LOCAL_AI_MODEL: ${FRIDAY_LOCAL_AI_MODEL:-qwen3:4b-instruct}
      FRIDAY_LOCAL_AI_CONTEXT: ${FRIDAY_LOCAL_AI_CONTEXT:-8192}
      FRIDAY_LOCAL_AI_MAX_TOKENS: ${FRIDAY_LOCAL_AI_MAX_TOKENS:-512}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    volumes:
      - friday_data:/data
    networks:
      - friday_frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3010/healthz"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  ollama:
    image: ollama/ollama:0.32.14
    container_name: friday-ollama
    restart: unless-stopped
    profiles: ["local-ai"]
    volumes:
      - friday_ollama:/root/.ollama
    networks:
      - friday_frontend
    security_opt:
      - no-new-privileges:true

networks:
  friday_frontend:
    name: friday_frontend

volumes:
  friday_data:
    name: friday_data
  friday_ollama:
    name: friday_ollama
