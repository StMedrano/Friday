services:
  friday:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: friday
    restart: unless-stopped
    ports:
      - "${FRIDAY_UI_PORT:-3010}:3010"
    environment:
      TZ: ${TZ:-America/Chicago}
      FRIDAY_PORT: 3010
      FRIDAY_MODE: ${FRIDAY_MODE:-mock}
      FRIDAY_DOCKER_ENABLED: ${FRIDAY_DOCKER_ENABLED:-false}
      FRIDAY_DOCKER_SOCKET: /var/run/docker.sock
      FRIDAY_DOCKER_HOST_NAME: ${FRIDAY_DOCKER_HOST_NAME:-VM 102}
      FRIDAY_PROXMOX_ENABLED: ${FRIDAY_PROXMOX_ENABLED:-false}
      FRIDAY_PROXMOX_URL: ${FRIDAY_PROXMOX_URL:-}
      FRIDAY_PROXMOX_TOKEN_ID: ${FRIDAY_PROXMOX_TOKEN_ID:-}
      FRIDAY_PROXMOX_TOKEN_SECRET: ${FRIDAY_PROXMOX_TOKEN_SECRET:-}
      FRIDAY_PROXMOX_INSECURE: ${FRIDAY_PROXMOX_INSECURE:-false}
      FRIDAY_VM100_OBSERVER_ENABLED: ${FRIDAY_VM100_OBSERVER_ENABLED:-false}
      FRIDAY_VM100_OBSERVER_URL: ${FRIDAY_VM100_OBSERVER_URL:-}
      FRIDAY_VM100_OBSERVER_TOKEN: ${FRIDAY_VM100_OBSERVER_TOKEN:-}
      FRIDAY_VM100_OBSERVER_HOST_NAME: ${FRIDAY_VM100_OBSERVER_HOST_NAME:-VM 100}
      FRIDAY_MONITORING_ENABLED: ${FRIDAY_MONITORING_ENABLED:-false}
      FRIDAY_MONITORING_POLL_SECONDS: ${FRIDAY_MONITORING_POLL_SECONDS:-30}
      FRIDAY_MONITORING_OFFLINE_GRACE_SECONDS: ${FRIDAY_MONITORING_OFFLINE_GRACE_SECONDS:-300}
      FRIDAY_MONITORING_STATE_PATH: ${FRIDAY_MONITORING_STATE_PATH:-/data/monitoring-state.json}
      FRIDAY_MONITORING_HISTORY_LIMIT: ${FRIDAY_MONITORING_HISTORY_LIMIT:-2000}
      FRIDAY_DIAGNOSTICS_ENABLED: ${FRIDAY_DIAGNOSTICS_ENABLED:-false}
      FRIDAY_ENDPOINTS_ENABLED: ${FRIDAY_ENDPOINTS_ENABLED:-false}
      FRIDAY_ENDPOINT_URLS: ${FRIDAY_ENDPOINT_URLS:-}
      FRIDAY_AI_ENABLED: ${FRIDAY_AI_ENABLED:-false}
      FRIDAY_AI_PROVIDER_ORDER: ${FRIDAY_AI_PROVIDER_ORDER:-groq,gemini,ollama}
      FRIDAY_AI_REQUEST_TIMEOUT_MS: ${FRIDAY_AI_REQUEST_TIMEOUT_MS:-}
      FRIDAY_CLOUD_AI_TIMEOUT_MS: ${FRIDAY_CLOUD_AI_TIMEOUT_MS:-15000}
      FRIDAY_LOCAL_AI_TIMEOUT_MS: ${FRIDAY_LOCAL_AI_TIMEOUT_MS:-30000}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      FRIDAY_LOCAL_AI_ENABLED: ${FRIDAY_LOCAL_AI_ENABLED:-false}
      FRIDAY_LOCAL_AI_URL: ${FRIDAY_LOCAL_AI_URL:-http://ollama:11434}
      FRIDAY_LOCAL_AI_MODEL: ${FRIDAY_LOCAL_AI_MODEL:-qwen3:4b-instruct}
      FRIDAY_LOCAL_AI_CONTEXT: ${FRIDAY_LOCAL_AI_CONTEXT:-8192}
      FRIDAY_LOCAL_AI_MAX_TOKENS: ${FRIDAY_LOCAL_AI_MAX_TOKENS:-512}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    volumes:
      - friday_data:/data
    networks:
      - friday_frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3010/healthz"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  ollama:
    image: ollama/ollama:0.32.14
    container_name: friday-ollama
    restart: unless-stopped
    profiles: ["local-ai"]
    volumes:
      - friday_ollama:/root/.ollama
    networks:
      - friday_frontend
    security_opt:
      - no-new-privileges:true

networks:
  friday_frontend:
    name: friday_frontend

volumes:
  friday_data:
    name: friday_data
  friday_ollama:
    name: friday_ollama
