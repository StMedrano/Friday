# Friday homelab executor: run on the Docker host whose containers Friday may
# start, stop or restart (for example VM100). It is the ONLY Friday component
# that holds this host's Docker socket for changes, and it acts only on the
# containers in ./allowlist.json. Bind it to a LAN address Friday can reach and
# nothing else. See executor/README.md.
services:
  friday-executor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: friday-executor
    restart: unless-stopped
    user: "10001:10001"
    # The socket's group grants Docker daemon authority; only this container gets it.
    group_add:
      - "${FRIDAY_DOCKER_SOCKET_GID:?Set from stat -c %g /var/run/docker.sock}"
    read_only: true
    cap_drop:
      - ALL
    pids_limit: 64
    ports:
      - "${FRIDAY_EXECUTOR_BIND_ADDRESS:?Set the LAN address Friday reaches, never 0.0.0.0}:${FRIDAY_EXECUTOR_PORT:-3198}:3198"
    environment:
      FRIDAY_EXECUTOR_PORT: 3198
      FRIDAY_EXECUTOR_BIND_ADDRESS: 0.0.0.0
      FRIDAY_EXECUTOR_TOKEN: ${FRIDAY_EXECUTOR_TOKEN:?FRIDAY_EXECUTOR_TOKEN is required (32+ characters)}
      FRIDAY_EXECUTOR_ALLOWLIST_PATH: /config/allowlist.json
      FRIDAY_EXECUTOR_DOCKER_SOCKET: /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./allowlist.json:/config/allowlist.json:ro
    security_opt:
      - no-new-privileges:true
